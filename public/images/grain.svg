<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Grano fino en mosaico. baseFrequency alta = puntos pequeños, casi de
       película; stitchTiles evita la costura visible al repetirse. La opacidad
       final se controla desde CSS. -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.55" intercept="0" />
    </feComponentTransfer>
  </filter>
  <rect width="200" height="200" filter="url(#grain)" />
</svg>
